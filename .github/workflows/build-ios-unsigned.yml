# Builds an UNSIGNED iOS .ipa on a free GitHub-hosted macOS runner.
#
# Why this exists: EAS Build requires a paid Apple Developer account to produce a
# real-device (arm64) build. Plain `xcodebuild` does not — compiling has never been
# the paid part, *signing* is. So we compile here with signing disabled, ship the
# raw .ipa as an artifact, and sign it locally on Windows with a free Apple ID via
# AltStore/AltServer. See docs/PRD.md §3.2.
#
# Cost: $0. Public repos get free, UNMETERED Actions minutes including macOS.
# If this repo ever goes private, macOS bills at a 10x multiplier — see the cost
# audit in research/phone-integration/.

name: Build unsigned iOS app (for sideloading)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'design/**'
      - 'research/**'
      - 'testing/**'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. This workflow only reads the repo and uploads an artifact —
# it never needs to write to the repo, publish packages, or mint tokens. On a
# PUBLIC repo the default token grant is worth narrowing explicitly, so a
# compromised dependency in the build can't push commits.
permissions:
  contents: read

jobs:
  build:
    # Pinned deliberately. `macos-latest` began pointing at macos-26 mid-2026;
    # relying on the floating label means a runner-image rollover can break the
    # build with no change on our side. Bump this on purpose, never by surprise.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` fails hard if package-lock.json and package.json disagree.
      # If this step fails, the cause is almost always a dependency added without
      # committing the regenerated lockfile — not an Xcode problem.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo prebuild (generate native iOS project)
        run: npx expo prebuild --platform ios --clean

      # DIAGNOSTIC — the scheme name is the #1 predicted failure of this workflow,
      # and it CANNOT be determined locally: Windows refuses to run
      # `expo prebuild --platform ios` even with --no-install (verified; see
      # research/phone-integration/expo-cng-constraints.md). Printing it here means
      # one CI round gives the answer instead of a guess-and-retry loop.
      - name: List available Xcode schemes
        run: |
          ls -la ios/*.xcodeproj/xcshareddata/xcschemes/ || true
          cd ios && xcodebuild -list -workspace *.xcworkspace

      - name: Archive (code signing disabled)
        run: |
          # `bash -e` alone does NOT catch a failure on the left side of a pipe,
          # and the archive command below is piped. Without pipefail a failed
          # xcodebuild exits 0 here and detonates later in "Package unsigned .ipa"
          # with a confusing "no such file" — exactly the misleading-failure mode
          # documented in .github/workflows/index.md.
          set -o pipefail
          cd ios

          # Read the scheme from the WORKSPACE explicitly. `expo prebuild` emits both
          # an .xcodeproj and an .xcworkspace; a bare `xcodebuild -list` is ambiguous
          # when both are present, and the JSON top-level key is "workspace" (not
          # "project") when it resolves one. Must match the archive invocation below.
          SCHEME=$(xcodebuild -list -json -workspace *.xcworkspace \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "Using scheme: $SCHEME"

          # No xcpretty: it is not guaranteed to be preinstalled on macos-26, and a
          # missing formatter would read as an Xcode failure. Raw output is verbose
          # but searchable in the Actions log.
          xcodebuild archive \
            -workspace *.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      # An .ipa is just a zip with the .app inside a Payload/ directory.
      # We assemble it by hand because `xcodebuild -exportArchive` insists on a
      # signing identity, which is exactly what we're avoiding.
      - name: Package unsigned .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/app.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry unsigned-app.ipa Payload
          ls -lh unsigned-app.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-ipa
          path: ${{ runner.temp }}/unsigned-app.ipa
          if-no-files-found: error
          retention-days: 14
